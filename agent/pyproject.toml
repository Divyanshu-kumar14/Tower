[project]
name = "tower-agent"
version = "0.1.0"
description = "TOWER Studio Lot ATC — deterministic agent + slot graph (T-01 contracts only)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "pydantic>=2.0,<3",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["graph"]
